<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/static/favicon.ico">
    <title>Sign in · Apprendre</title>

    <style>
        :root {
            --base: #1e1e2e;
            --mantle: #181825;
            --crust: #11111b;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --surface0: #313244;
            --surface1: #45475a;
            --mauve: #cba6f7;
            --blue: #89b4fa;
            --red: #f38ba8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: var(--base);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
        }

        main {
            width: min(100%, 25rem);
            padding: 2rem;
            background: var(--mantle);
            border: 1px solid var(--surface0);
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem #11111b66;
        }

        h1 {
            margin: 0;
            color: var(--mauve);
            font-size: 2rem;
            letter-spacing: -.04em;
        }

        .subtitle {
            margin: .5rem 0 1.75rem;
            color: var(--subtext);
            line-height: 1.5;
        }

        form { display: grid; gap: 1.25rem; }

        label {
            display: grid;
            gap: .5rem;
            font-size: .95rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: .85rem 1rem;
            border: 1px solid var(--surface1);
            border-radius: .5rem;
            background: var(--base);
            color: var(--text);
            font: inherit;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus {
            outline: none;
            border-color: var(--mauve);
            box-shadow: 0 0 0 3px #cba6f722;
        }

        button {
            margin-top: .25rem;
            padding: .9rem;
            border: none;
            border-radius: .5rem;
            background: var(--mauve);
            color: var(--crust);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
        }

        button:hover { background: var(--blue); }

        button:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 4px;
        }

        .error {
            margin: 0 0 1.25rem;
            padding: .8rem 1rem;
            border: 1px solid #f38ba844;
            border-radius: .5rem;
            background: #f38ba811;
            color: var(--red);
            line-height: 1.5;
        }

        .note {
            margin: 1.5rem 0 0;
            color: var(--subtext);
            text-align: center;
            font-size: .8rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main aria-labelledby="login-title">
        <h1 id="login-title">Apprendre</h1>
        <p class="subtitle">Welcome back. Continue your French journey.</p>

        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
            <label for="username">
                Username
                <input
                    id="username"
                    name="username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="64"
                    required
                    autofocus
                >
            </label>

            <label for="password">
                Password
                <input
                    id="password"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    maxlength="1024"
                    required
                >
            </label>

            <button type="submit">Sign in →</button>
        </form>

        <p class="note">Galère ? C'est la vie.</p>
    </main>
</body>
</html>
